name: Check jobs.json structure

on:
  push:
    branches: [main]
    paths:
      - 'docs/data/jobs.json'
  pull_request:
    paths:
      - 'docs/data/jobs.json'

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate jobs.json structure
        run: python3 scripts/check-jobs-json.py
