name: Check asset cache-bust versions

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/js/scripts.js'
      - 'docs/js/menu.js'
      - 'docs/css/styles.css'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/js/scripts.js'
      - 'docs/js/menu.js'
      - 'docs/css/styles.css'

# These checks only read the repository.
permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scripts.js / menu.js / styles.css cache-bust versions are current
        run: bash scripts/check-asset-versions.sh
